# The anti-ai-design runtime: one Cargo workspace next to the skill it powers.
# `cargo build --release -p anti-ai-design` produces the engine binary the launcher
# (skill/scripts/anti-ai-design) runs. See docs/ENGINE.md.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.18"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anti-ai-design-foundation = { path = "crates/foundation" }
anti-ai-design-common = { path = "crates/common" }
anti-ai-design-core = { path = "crates/core" }
anti-ai-design-detect = { path = "crates/detect" }
anti-ai-design-html = { path = "crates/html" }
anti-ai-design-browser = { path = "crates/browser" }
anti-ai-design-live = { path = "crates/live" }
anti-ai-design-context = { path = "crates/context" }
anti-ai-design-hook = { path = "crates/hook" }
anti-ai-design-comp = { path = "crates/comp" }
anti-ai-design-comp-verbs = { path = "crates/comp-verbs" }
anti-ai-design-bundle = { path = "crates/bundle" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
once_cell = "1"

# Dev and test builds keep file:line backtraces and drop the rest of the
# debuginfo, which is most of a target dir's size. Dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
