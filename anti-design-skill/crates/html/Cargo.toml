[package]
name = "anti-ai-design-html"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Vector dispatcher used by tests/vectors.rs to replay the recorded JS call
# vectors through the Rust port.
vectors = ["anti-ai-design-core/vectors"]

[dependencies]
anti-ai-design-common = { workspace = true }
anti-ai-design-core = { workspace = true }
anti-ai-design-detect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
regex = { workspace = true }
once_cell = { workspace = true }
indexmap = "2"
scraper = { version = "0.27", default-features = false }
ego-tree = "0.11"
html5ever = "0.39"
selectors = "0.38"
cssparser = "0.37"
thiserror = { workspace = true }

[dev-dependencies]
anti-ai-design-core = { workspace = true, features = ["vectors"] }
anti-ai-design-html = { path = ".", features = ["vectors"] }
